<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>QADR OPS</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="app"></main>
    <template id="auth-template">
      <section class="auth-shell">
        <div class="hero"><span class="eyebrow">GESTION COMMERCIALE</span><h1>QADR <em>OPS</em></h1><p>Une gestion simple, rapide et adaptée à votre commerce.</p><ul><li>Ventes et stock en temps réel</li><li>Paiements espèces & mobile money</li><li>Votre marque au premier plan</li></ul></div>
        <div class="auth-card"><div class="tabs" aria-label="Choisir le parcours"><button data-tab="login" class="active" aria-pressed="true">Connexion</button><button data-tab="register" aria-pressed="false">Créer mon espace</button></div>
          <form id="login-form" class="form"><h2>Bon retour</h2><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label><button>Se connecter</button></form>
          <form id="register-form" class="form hidden"><h2>Créez votre commerce</h2><div class="two"><label>Votre nom<input name="ownerName" required></label><label>E-mail<input name="email" type="email" required></label></div><label>Mot de passe <small>10 caractères minimum</small><input name="password" type="password" minlength="10" required></label><hr><div class="two"><label>Nom du commerce<input name="businessName" required></label><label>Secteur<select name="sector"><option value="general_store">Boutique générale</option><option value="hardware">Quincaillerie</option><option value="phones">Téléphones & accessoires</option><option value="clothing">Vêtements</option></select></label></div><div class="two"><label>Téléphone professionnel<input name="phone" required></label><label>Adresse<input name="address"></label></div><label>E-mail professionnel <small>facultatif</small><input name="businessEmail" type="email"></label><button>Créer mon espace gratuit</button></form>
          <p id="auth-error" class="notice error hidden"></p>
        </div>
      </section>
    </template>
    <script src="/app.js"></script>
  </body>
</html>
